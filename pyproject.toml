[project]
name = "bili-danmaku"
version = "0.1.0"
description = "B 站直播弹幕提取器：实时抓取、多格式落盘、Web 面板"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "brotli>=1.1",
    "click>=8.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]
# V2 词云的可选依赖：
#   jieba     中文分词（只有 sdist；没装时退到内置二元组分词，功能仍可用）
#   wordcloud 只用于 --format png（会带进 matplotlib/numpy/pillow，比较重）；
#             text / json / html 三种输出零依赖
wordcloud = ["jieba>=0.42", "wordcloud>=1.9"]

[project.scripts]
bili-danmaku = "bili_danmaku.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 前端构建产物随 wheel 分发（`tools/build_wheel.py` 会先把 web/dist 摆到
# src/bili_danmaku/web_dist/，构建完再清掉，因此源码树里平时没有这个目录）。
# 后端优先从这个包内目录托管前端，装完即可用；没有它则回退到内建提示页。
[tool.setuptools.package-data]
bili_danmaku = ["web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 需要真实联网访问 B 站的测试（默认跳过，用 pytest -m live 运行）",
]
addopts = "-q -m 'not live'"

# --------------------------------------------------------------------------- #
# 覆盖率（M4）
#
#   .\.venv\Scripts\python.exe -m pytest --cov --cov-report=term-missing
#
# 度量口径：**核心模块**（协议 / 解析 / 连接 / 过滤 / 落盘 / 服务端 / 存储 / 网络接口）
# 目标 ≥ 85%，由 `fail_under` 强制。下面这些被排除在度量之外，理由各不相同但都是
# "把它算进百分比只会让『核心逻辑有没有被测到』变模糊"：
#   * `cli.py` / `__main__.py` —— 命令编排与进程入口，行为由 tests/test_cli.py 的
#     端到端用例保证；
#   * `gui/_win32.py` / `gui/panel_window.py` / `gui/tray.py` —— GUI 展示层，
#     tkinter 窗口与托盘菜单的**交互**在自动化环境里点不了（窗口会被抢占、
#     菜单需要真人点击）。
#
# ⚠️ 排除 ≠ 不测。GUI 里**可测的部分仍在测量之外但有用例**（tests/test_gui.py 20 项）：
#    菜单结构与置灰逻辑、状态文案、图标定位与加载、托盘消息窗口创建、CLI 接线；
#    端到端另有 `tools/smoke_tray.py`（Tk 窗口 + 托盘图标 + 消息泵 + 退出路径）。
#    只有"像素与点击手感"真的靠手测，那部分才不计入覆盖率。
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["src/bili_danmaku"]
omit = [
    "src/bili_danmaku/cli.py",
    "src/bili_danmaku/__main__.py",
    "src/bili_danmaku/gui/_win32.py",
    "src/bili_danmaku/gui/panel_window.py",
    "src/bili_danmaku/gui/tray.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    # 版本兼容分支：只在别的 websockets 版本上才会走到
    "except TypeError:  # pragma: no cover - 旧版 websockets",
]
