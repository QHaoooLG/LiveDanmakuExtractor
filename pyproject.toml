[project]
name = "bili-danmaku"
version = "0.1.0"
description = "B 站直播弹幕提取器：实时抓取、多格式落盘、Web 面板"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QHaoooLG", email = "qhaooolg@foxmail.com" }]
keywords = ["bilibili", "danmaku", "live", "websocket", "scraper", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "brotli>=1.1",
    "click>=8.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# V2 词云的可选依赖：
#   jieba     中文分词（只有 sdist；没装时退到内置二元组分词，功能仍可用）
#   wordcloud 只用于 --format png（会带进 matplotlib/numpy/pillow，比较重）；
#             text / json / html 三种输出零依赖
wordcloud = ["jieba>=0.42", "wordcloud>=1.9"]

[project.scripts]
bili-danmaku = "bili_danmaku.cli:main"

[project.urls]
Homepage = "https://github.com/QHaoooLG/LiveDanmakuExtractor"
Repository = "https://github.com/QHaoooLG/LiveDanmakuExtractor"
Issues = "https://github.com/QHaoooLG/LiveDanmakuExtractor/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 前端构建产物随 wheel 分发（`tools/build_wheel.py` 会先把 web/dist 摆到
# src/bili_danmaku/web_dist/，构建完再清掉，因此源码树里平时没有这个目录）。
# 后端优先从这个包内目录托管前端，装完即可用；没有它则回退到内建提示页。
[tool.setuptools.package-data]
bili_danmaku = ["web_dist/**/*"]
