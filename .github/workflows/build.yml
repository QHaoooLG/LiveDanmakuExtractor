name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python 包：确认依赖声明正确、包可构建、CLI 入口可用
  # ---------------------------------------------------------------------------
  package:
    name: Python package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 检查核心依赖可导入
        run: python -c "import bili_danmaku, fastapi, websockets, brotli, httpx, pydantic; print('imports ok')"

      - name: 检查 CLI 入口
        run: bili-danmaku --help

      - name: 构建 wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 面板前端：确认依赖可安装、产物可构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建面板产物
        working-directory: web
        run: npm run build

  # ---------------------------------------------------------------------------
  # 静态检查：ruff（非阻塞，只报问题）
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src tools

      - name: ruff format --check
        run: ruff format --check src
